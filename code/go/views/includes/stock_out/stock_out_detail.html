{{define "form"}}
<form class="layui-form model-form" action="">
    <div class="layui-field-box">
        <fieldset class="layui-elem-field layui-field-title" style="margin: 20px 0;">
            <legend class="layui-center">出库明细单</legend>
        </fieldset>

        <div class="layui-form-item">
            <div class="layui-table-container">
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>药品ID</th>
                        <th>出库数量</th>

                    </tr>
                    </thead>
                    <tbody id="transferTable">
                    {{range .medicines}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>{{.ProductID}}</td>
                        <td>{{.Quantity}}</td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="7" class="layui-center">暂无出库数据</td>
                    </tr>
                    {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</form>
{{end}}
