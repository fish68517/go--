{{define "form"}}
<form class="layui-form model-form" action="">
    <input name="id" id="id" type="hidden" value="{{.info.ID}}">
    <div class="layui-form-item">
        <label class="layui-form-label">设备类型：</label>
        <div class="layui-input-block">
            <select  name="equipment_type" id="equipment_type">
                <option value="煎药机">煎药机</option>
                <option value="包装机">包装机</option>
                <option value="打印机">打印机</option>
            </select>

        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">设备名称：</label>
        <div class="layui-input-block">
            <input name="device_name" value="{{.info.DeviceName}}" lay-verify="required" autocomplete="off" placeholder="请输入设备名称"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">所在房间：</label>
        <div class="layui-input-block">
            <select  name="device_room" id="device_room">
                <option value="第一煎药室">第一煎药室</option>
                <option value="第二煎药室">第二煎药室</option>
                <option value="第三煎药室">第三煎药室</option>
            </select>

        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">设备编号：</label>
        <div class="layui-input-block">
            <input name="unit_number" value="{{.info.UnitNumber}}" lay-verify="required" autocomplete="off" placeholder="请输入设备编号"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">备注：</label>
        <div class="layui-input-block">
            <input name="remark" value="{{.info.Remark}}"  autocomplete="off" placeholder="请输入备注"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item text-center model-form-footer">
        <button class="layui-btn" lay-filter="submitForm" lay-submit="">立即保存</button>
        <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">关闭</button>
    </div>
</form>
<script>
    layui.use(['form'], function(){
        var form = layui.form,
            $ = layui.$;

        form.on('switch(status)', function(data) {
            $(data.elem).attr('type', 'hidden').val(this.checked ? 1 : 2);})
    })
</script>
{{end}}
