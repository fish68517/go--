{{define "form"}}
<form class="layui-form model-form" action="">
    <input name="id" id="id" type="hidden" value="{{.info.ID}}">
    <fieldset class="layui-elem-field" style="margin-top: 10px; color:#126d07">
        <legend>库存信息</legend>
    </fieldset>
    <div class="layui-field-box">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="color:red">产品ID</label>
                <div class="layui-input-inline" style="width:515px">
                    <input type="text" name="product_id" id="product_id" disabled value="{{.info.ProductID}}"
                           lay-verify="required" autocomplete="on" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">产品名称</label>
                <div class="layui-input-inline">
                    <input type="text" name="product_name" disabled id="product_name" value="{{.info.ProductName}}"
                           autocomplete="on" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="color:red" disabled>仓库ID</label>
                <div class="layui-input-inline">
                    <input type="text" name="warehouse_id" disabled id="warehouse_id" value="{{.info.WarehouseID}}"
                           lay-verify="number|required" autocomplete="on" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="color:red">当前库存</label>
                <div class="layui-input-inline">
                    <input type="text" name="current_stock" disabled id="current_stock" value="{{.info.Quantity}}"
                           lay-verify="number|required" autocomplete="on" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="color:red">出库数量</label>
                <div class="layui-input-inline">
                    <input type="text" name="quantity" id="quantity" lay-verify="number|required" autocomplete="on" class="layui-input">
                </div>
            </div>
        </div>
    </div>
    <div class="layui-form-item text-center model-form-footer">
        <button class="layui-btn" lay-filter="submitForm" lay-submit="">立即保存</button>
        <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">关闭</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function(){
        var form = layui.form,
            laydate = layui.laydate,
            $ = layui.$;

        // 初始化日期选择器
        laydate.render({
            elem: '#created_time',
            type: 'datetime'
        });
        laydate.render({
            elem: '#updated_time',
            type: 'datetime'
        });

        // 表单提交验证
        form.verify({
            product_id: function(value){
                if(!value) return '产品ID不能为空';
            },
            warehouse_id: function(value){
                if(!/^\d+$/.test(value)) return '仓库ID必须是数字';
            },
            quantity: function(value){
                if(!/^\d+$/.test(value)) return '库存数量必须是数字';
            }
        });
    });
</script>
{{end}}
