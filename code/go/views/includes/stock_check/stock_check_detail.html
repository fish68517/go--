{{define "form"}}
<form class="layui-form model-form" action="">
    <div class="layui-field-box">
        <fieldset class="layui-elem-field layui-field-title" style="margin: 20px 0;">
            <legend class="layui-center">盘点明细单</legend>
        </fieldset>

        <div class="layui-form-item">
            <div class="layui-table-container">
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>盘点ID</th>
                        <th>药品ID</th>
                        <th>系统数量</th>
                        <th>实际数量</th>
                        <th>差异数量</th>
                        <th>批次号</th>
                        <th>备注</th>

                    </tr>
                    </thead>
                    <tbody id="transferTable">
                    {{range .medicines}}
                    <tr>
                        <td>{{.CheckID}}</td>
                        <td>{{.ProductID}}</td>
                        <td>{{.SystemQty}}</td>
                        <td>{{.ActualQty}}</td>
                        <td>{{.Difference}}</td>
                        <td>{{.BatchNo}}</td>
                        <td>{{.Remark}}</td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="7" class="layui-center">暂无盘点数据</td>
                    </tr>
                    {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</form>
{{end}}
