{{define "form"}}
<form class="layui-form model-form" action="" >
    <div class="layui-form-item text-center model-form-footer">
        <button class="layui-btn" lay-filter="submitForm" lay-submit="">立即保存</button>
        <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">关闭</button>
    </div>

    <!-- 盘点基本信息 -->
    <fieldset class="layui-elem-field" style="margin-top: 10px; color:#126d07">
        <legend>盘点基本信息</legend>
        <div class="layui-field-box">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">盘点单号</label>
                    <div class="layui-input-inline" style="width:515px">
                        <input type="text" name="order_no" id="order_no" class="layui-input" readonly>
                    </div>
                </div>

                <div class="layui-inline">
                    <label class="layui-form-label">仓库</label>
                    <div class="layui-input-inline">
                        <select name="warehouse_id" id="warehouse_id" lay-verify="required">
                            <option value="">请选择仓库</option>
                            <option value="1">仓库</option>
                            <option value="2">药房</option>
                        </select>
                    </div>
                </div>

                <div class="layui-inline">
                    <label class="layui-form-label">操作人</label>
                    <div class="layui-input-inline">
                        <select name="operator_id" id="operator_id" lay-verify="required">
                            <option value="">请选择操作人</option>
                            <option value="1">张三</option>
                            <option value="2">李四</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
        </div>
    </fieldset>
</form>

<!-- 盘点明细 -->
<div class="layui-form-item">
    <label class="layui-form-label">盘点明细</label>
    <div class="layui-input-block">
        <table class="layui-table" id="tableTest">
            <thead>
            <tr>
                <th>药品名称</th>
                <th>药品编码</th>
                <th>系统数量</th>
                <th>实盘数量</th>
                <th>差异数量</th>
                <th>批次号</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="medicinesTable">
            <!-- 动态添加行 -->
            </tbody>
        </table>
        <button type="button" class="layui-btn" id="addCheckItem">新增盘点项</button>
    </div>
</div>

<script>
    // 初始化盘点单号
    $(document).ready(function(){
        $('#order_no').val('PC'+ new Date().getTime());
    });

    // 新增盘点项
    $('#addCheckItem').on('click', function(){
        var index = $('#medicinesTable tr').length;
        var newRow = `
        <tr>
           <td>
                <input type="text" name="medicines[${index}].product_name" class="layui-input product-id" required>
            </td>
            <td>
                <input type="text" name="medicines[${index}].product_id" class="layui-input product-id" required>
            </td>
            <td>
                <input type="number" name="medicines[${index}].system_quantity" class="layui-input system-quantity" required>
            </td>
            <td>
                <input type="number" name="medicines[${index}].actual_quantity" class="layui-input actual-quantity" required>
            </td>
            <td>
                <input type="text" name="medicines[${index}].difference" class="layui-input difference" readonly>
            </td>
            <td>
                <input type="text" name="medicines[${index}].batch_no" class="layui-input">
            </td>
            <td>
                <input type="text" name="medicines[${index}].remark" class="layui-input">
            </td>
            <td>
                <button type="button" class="layui-btn layui-btn-danger layui-btn-sm delete-item">删除</button>
            </td>
        </tr>`;

        $('#medicinesTable').append(newRow);
        initQuantityCalculation();
    });

    // 删除盘点项
    $(document).on('click', '.delete-item', function(){
        $(this).closest('tr').remove();
    });

    // 计算差异数量
    function initQuantityCalculation() {
        $(document).on('input', '.system-quantity, .actual-quantity', function(){
            var $tr = $(this).closest('tr');
            var system = parseFloat($tr.find('.system-quantity').val()) || 0;
            var actual = parseFloat($tr.find('.actual-quantity').val()) || 0;
            $tr.find('.difference').val(actual - system);
        });
    }
</script>
{{end}}
