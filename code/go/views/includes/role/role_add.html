{{define "form"}}
<form class="layui-form model-form" action="">
    <div class="layui-form-item">
        <label class="layui-form-label">设备类型：</label>
        <div class="layui-input-block">
            <input name="equipment_type" lay-verify="required" autocomplete="off" placeholder="请输入设备类型"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">设备编号：</label>
        <div class="layui-input-block">
            <input name="equipment_id" lay-verify="required" autocomplete="off" placeholder="请输入设备编号"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">卫生状态：</label>
        <div class="layui-input-block">
            <select name="health_status" lay-verify="required" lay-search="">
                <option value="">请选择卫生状态</option>
                <option value="1">良好</option>
                <option value="2">一般</option>
                <option value="3">较差</option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">消毒状态：</label>
        <div class="layui-input-block">
            <select name="disinfection_status" lay-verify="required" lay-search="">
                <option value="">请选择消毒状态</option>
                <option value="1">已消毒</option>
                <option value="2">未消毒</option>
                <option value="3">消毒过期</option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">运行状态：</label>
        <div class="layui-input-block">
            <select name="status" lay-verify="required" lay-search="">
                <option value="">请选择运行状态</option>
                <option value="1">正常运行</option>
                <option value="2">停机</option>
                <option value="3">故障</option>
                <option value="4">维修中</option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">巡检时间：</label>
        <div class="layui-input-block">
            <input name="inspection_time" lay-verify="required" autocomplete="off" class="layui-input" type="text" id="inspectionTime">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">巡检人员：</label>
        <div class="layui-input-block">
            <input name="inspector" lay-verify="required" autocomplete="off" placeholder="请输入巡检人员姓名"
                   class="layui-input" type="text">
        </div>
    </div>
    <div class="layui-form-item text-center model-form-footer">
        <button class="layui-btn" lay-filter="submitForm" lay-submit="">立即保存</button>
        <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">关闭</button>
    </div>
</form>
<script>
    layui.use(['form'], function(){
        var form = layui.form,
            $ = layui.$;

        form.on('switch(status)', function(data) {
            $(data.elem).attr('type', 'hidden').val(this.checked ? 1 : 2);})})
</script>
{{end}}
