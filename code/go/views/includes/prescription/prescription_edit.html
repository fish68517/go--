{{define "form"}}
<form class="layui-form model-form" action="">
  <input name="id" id="id" type="hidden" value="{{.info.ID}}">
  <fieldset class="layui-elem-field" style="margin-top: 10px; color:#126d07">
    <legend>处方基本信息</legend>
  </fieldset>
    <div class="layui-field-box">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label"><span class="star">*</span>医院名称</label>
          <div class="layui-input-inline">
            <input  type="text" readonly="readonly" name="hospitalName" lay-verify="required" id="hospitalName" value="{{.info.HospitalName}}" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">地址</label>
          <div class="layui-input-inline" style="width:515px">
            <input  type="text" name="patientAddress" id="patientAddress" value="{{.info.PatientAddress}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">处方类型</label>
          <div class="layui-input-inline">
            <select  name="prescriptionType" id="prescriptionType" >
              <option value="0">门诊</option>
              <option value="1">住院</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">处方日期</label>
          <div class="layui-input-inline">
            <input type="text" name="doTime" id="doTime" value="{{.info.DoTime}}" lay-verify="datetime" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">门诊序号</label>
          <div class="layui-input-inline">
            <input type="text" name="deletionNumber"   id="deletionNumber" value="{{.info.DeletionNumber}}" autocomplete="on" class="layui-input"><!-- 去除此input的lay_verify-->
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red"><span class="star">*</span>处方号</label>
          <div class="layui-input-inline">
            <input type="text" name="prescriptionNumber" id="prescriptionNumber" value="{{.info.PrescriptionNumber}}" lay-verify="required" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red"><span class="star">*</span>姓名</label>
          <div class="layui-input-inline">
            <input type="text" name="patientName" id="patientName" value="{{.info.PatientName}}" lay-verify="Name|required" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">性别</label>
          <div class="layui-input-inline">
            <select  name="patientSex" id="patientSex">
              <option value="1">男</option>
              <option value="2">女</option>
              <option value="3">不祥</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">年龄</label>
          <div class="layui-input-inline">
            <input type="text" name="patientAge" id="patientAge" value="{{.info.PatientAge}}" lay-verify="number" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">联系电话</label>
          <div class="layui-input-inline">
            <input type="text" name="patientPhone" id="patientPhone" value="{{.info.PatientPhone}}" lay-verify="telephone" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">就诊科室</label>
          <div class="layui-input-inline">
            <input type="text" name="departmentName" id="departmentName" value="{{.info.DepartmentName}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">诊断结果</label>
          <div class="layui-input-inline">
            <input type="text" name="diagnosisResult" id="diagnosisResult" value="{{.info.DiagnosisResult}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red"><span class="star">*</span>贴数</label>
          <div class="layui-input-inline">
            <input type="text" name="dosage" id="dosage" value="{{.info.Dosage}}" lay-verify="number|required"  autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red"><span class="star">*</span>次数</label>
          <div class="layui-input-inline">
            <input type="text" name="AdministrationCount" id="AdministrationCount" value="{{.info.AdministrationCount}}" lay-verify="number|required" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">服用方式</label>
          <div class="layui-input-inline">
            <select name="AdministrationMethod" id="AdministrationMethod">
              <option value=""></option>
              <option value="内服">内服</option>
              <option value="外用">外用</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">浸泡时间</label>
          <div class="layui-input-inline">
            <input type="text" name="SoakTime" id="SoakTime" value="{{.info.SoakTime}}" lay-verify="number" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">病区号</label>
          <div class="layui-input-inline">
            <input type="text" name="inpatientArea" id="inpatientArea" value="{{.info.InpatientArea}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">病房号</label>
          <div class="layui-input-inline">
            <input type="text" name="wardName" id="wardName" value="{{.info.WardName}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" >病床号</label>
          <div class="layui-input-inline">
            <input type="text" name="sickBed" id="sickBed" value="{{.info.SickBed}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">包装量</label>
          <div class="layui-input-inline">
            <select name="packageCount" id="packageCount">
              <option value="200">200</option>
              <option value="180">180</option>
              <option value="150">150</option>
              <option value="120">120</option>
              <option value="100">100</option>
              <option value="75">75</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">煎药方案</label>
          <div class="layui-input-inline">
            <select name="decoctionScheme" id="decoctionScheme">
              <option value="0">----请选择----</option>
              <option value="1">微压（密闭）（60min）</option>
              <option value="2">微压（密闭）汤药（25min）</option>
              <option selected="selected" value="3">微压(密闭)(40min)</option>
              <option value="4">常压解表（10min，10min）</option>
              <option value="5">常压汤药（20min，15min）</option>
              <option value="6">常压补药（25min，20min）</option>
              <option value="21">先煎汤药（10min，20min，15min）</option>
              <option value="36">后下解表（10min（3：7），10min）</option>
              <option value="11">new(60min)</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red"><span class="star">*</span>是否代煎</label>
          <div class="layui-input-inline">
            <select name="isDecoction" id="isDecoction">
              <option value="2">请选择</option>
              <option value="1">代煎</option>
              <option value="0">自煎</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="color:red">医生</label>
          <div class="layui-input-inline">
            <input type="text" name="DoctorName" id="DoctorName" value="{{.info.DoctorName}}" autocomplete="off" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">医生脚注</label>
          <div class="layui-input-inline">
            <input type="text" name="Footnote" id="Footnote"  value="{{.info.Footnote}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">取药时间</label>
          <div class="layui-input-inline">
            <input type="text" name="DrugPickupTime" id="DrugPickupTime" value="{{.info.DrugPickupTime}}" lay-verify="datetime" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">浸泡加水量</label>
          <div class="layui-input-inline">
            <input type="text" name="SoakWaterAmount" id="SoakWaterAmount" value="{{.info.SoakWaterAmount}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">煎药方式</label>
          <div class="layui-input-inline">
            <select name="DecoctionMethod" id="decoctionMethod">
              <option value="">请选择</option>
              <option value="1">先煎</option>
              <option value="2">后下</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">服用方法</label>
          <div class="layui-input-inline">
            <select name="AdministrationWay" id="AdministrationWay">
              <option value="">请选择</option>
              <option value="1">水煎餐前</option>
              <option value="2">水煎餐后</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">取药号</label>
          <div class="layui-input-inline">
            <input type="text" name="DrugPickupNumber" id="DrugPickupNumber" value="{{.info.DrugPickupNumber}}" lay-verify="number" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">备注</label>
          <div class="layui-input-inline">
            <input type="text" name="Remarks" id="Remarks" value="{{.info.Remarks}}" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">备注A</label>
          <div class="layui-input-inline">
            <input type="text" name="AdditionalRemarksA" id="AdditionalRemarksA" value="{{.info.AdditionalRemarksA}}"  autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">备注B</label>
          <div class="layui-input-inline">
            <input type="text" name="AdditionalRemarksB" id="AdditionalRemarksB" value="{{.info.AdditionalRemarksB}}"  autocomplete="on" class="layui-input">
          </div>
        </div>


      </div>

      <div id="ExpressInfo"  style="display: none">
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 50px; color:#126d07">
          <legend>快递信息</legend>
        </fieldset>
        <div class="layui-form-item">
          <div class=layui-inline>
            <label class="layui-form-label">收件方</label>
            <div class="layui-input-inline">
              <input type="text" name="Dtbcompany" id="Dtbcompany" autocomplete="on" class="layui-input">
            </div>
          </div>
          <div class=layui-inline>
            <label class="layui-form-label">收件电话</label>
            <div class="layui-input-inline">
              <input type="text" name="Dtbphone" id="Dtbphone" autocomplete="off" class="layui-input">
              <div class="layui-form-item">
              </div>
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">收件地址</label>
          <div class="layui-input-block" style="margin-right:45px">
            <input type="text" name="Dtbaddress" id="Dtbaddress" autocomplete="on" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">备注</label>
          <div class="layui-input-block" style="margin-right:45px">
            <input id="Dtbremark" type="text" name="Dtbremark" autocomplete="on" placeholder="" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label">快递方式</label>
            <div class="layui-input-inline">
              <select name="dtbtype" id="dtbtype">
                <option value="0">厂内配送</option>
                <option selected value="1">顺丰</option>
                <option value="2">圆通</option>
                <option value="3">中通</option>
                <option value="4">EMS</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label">支付方式</label>
            <div class="layui-input-inline">
              <select name="PayMethod" id="PayMethod">
                <option value="1">月结</option>
                <option selected value="2">到付</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="layui-form-item text-center model-form-footer">
      <button class="layui-btn" lay-filter="submitForm" lay-submit="">立即保存</button>
      <button class="layui-btn layui-btn-primary" type="button" ew-event="closeDialog">关闭</button>
    </div>
</form>

<script>
  layui.use(['form'], function(){
    var form = layui.form,
            $ = layui.$;

    form.on('switch(status)', function(data) {
      $(data.elem).attr('type', 'hidden').val(this.checked ? 1 : 2);})
  })
</script>
{{end}}
