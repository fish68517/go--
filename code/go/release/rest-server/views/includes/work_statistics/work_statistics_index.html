{{define "content"}}
<form class="layui-form toolbar">
<div class="layui-form-item">
  <div class="layui-inline">
    <label class="layui-form-label">员工姓名</label>
    <div class="layui-input-block">
      <input type="text" name="word_person" id="word_person" placeholder="请输入员工姓名" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-inline">
    <label class="layui-form-label">工作内容</label>
    <div class="layui-input-block">
      <select  id="word_content" name="word_content" class="layui-input-block">
        <option value="">全部</option>
        <option value="调剂">调剂</option>
        <option value="泡药">泡药</option>
        <option value="煎药">煎药</option>
        <option value="包装">包装</option>
        <option value="发货">发货</option>
      </select>
    </div>
  </div>

  <div class="layui-inline">
    <label class="layui-form-label">开始时间</label>
    <div class="layui-input-block">
      <input type="text" name="word_date_start" id="word_date_start" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input layui-date">
    </div>
  </div>
  <div class="layui-inline">
    <label class="layui-form-label">结束时间</label>
    <div class="layui-input-block">
      <input type="text" name="word_date_end" id="word_date_end" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input layui-date">
    </div>
  </div>
  <div class="layui-inline">
    <div class="layui-input-inline" style="width: auto;">
      {{query "查询"}}
    </div>
  </div>
</div>
</form>
<table class="layui-hide" id="tableList" lay-filter="tableList"></table>

{{end}}
