{{define "content"}}
<!-- 功能操作区一 -->
<form class="layui-form toolbar">
    <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">处方状态</label>
                <div class="layui-input-block">
                <select id="state" name="state" placeholder="【请选择处方状态】" lay-filter="type">
                    <option value="0" >【全部】</option>
                    <option value="0" >未审核</option>
                    <option value="1" >已审核</option>
                    <option value="1" >调剂</option>
                    <option value="1" >复核</option>
                    <option value="1" >泡药</option>
                    <option value="1" >煎药</option>
                    <option value="1" >包装</option>
                    <option value="1" >发货</option>
                </select>
                </div>
            </div>
        <div class="layui-inline">
            <label class="layui-form-label">医院名称</label>
            <div class="layui-input-block">
                <input type="text" name="hospital_name" placeholder="请输入医院名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">患者名称</label>
            <div class="layui-input-block">
                <input type="text" name="patient_name" placeholder="请输入患者名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">处方号</label>
            <div class="layui-input-block">
                <input type="text" name="prescription_number" placeholder="请输入处方号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">开始时间</label>
            <div class="layui-input-block">
                <input type="text" name="start_time" id="start_time" placeholder="yyyy-MM-dd HH:mm:ss"  class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">结束时间</label>
            <div class="layui-input-block">
                <input type="text" name="end_time" id="end_time" placeholder="yyyy-MM-dd HH:mm:ss"  class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <div class="layui-input-inline" style="width: auto;">
                {{query "查询"}}
            </div>
        </div>
    </div>


</form>

<!-- TABLE渲染区 -->
<table class="layui-hide" id="tableList" lay-filter="tableList"></table>

{{end}}
