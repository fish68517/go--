{{define "content"}}
<form class="layui-form toolbar">
  <div class="layui-form-item">
    <div class="layui-inline">
      <label class="layui-form-label">开始时间</label>
      <div class="layui-input-block">
        <input type="text" name="date_start" id="date_start" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input layui-date">
      </div>
    </div>
    <div class="layui-inline">
      <label class="layui-form-label">结束时间</label>
      <div class="layui-input-block">
        <input type="text" name="date_end" id="date_end" placeholder="yyyy-MM-dd HH:mm:ss" autocomplete="off" class="layui-input layui-date">
      </div>
    </div>
    <div class="layui-inline">
      <div class="layui-input-inline" style="width: auto;">
        {{query "查询"}}
      </div>
    </div>
  </div>
</form>
<table class="layui-hide" id="tableList" lay-filter="tableList"></table>

{{end}}
