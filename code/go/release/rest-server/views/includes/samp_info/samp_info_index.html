{{define "content"}}
<!-- 功能操作区一 -->
<form class="layui-form toolbar">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">检验状态</label>
            <div class="layui-input-block">
                <select id="status" name="status" placeholder="【请选择检验状态】" lay-filter="type">
                    <option value="0" >【全部】</option>
                    <option value="1" >合格</option>
                    <option value="2" >不合格</option>

                </select>
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">处方号</label>
            <div class="layui-input-block">
                <input type="text" name="prescription_number" id="prescription_number" placeholder="请输入处方号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">开始时间</label>
            <div class="layui-input-block">
                <input type="text" name="start_time" id="start_time" name="start_time" placeholder="yyyy-MM-dd HH:mm:ss"  class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">结束时间</label>
            <div class="layui-input-block">
                <input type="text" name="end_time" id="end_time" placeholder="yyyy-MM-dd HH:mm:ss"  class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <div class="layui-input-inline" style="width: auto;">
                {{query "查询"}}
                {{add "添加检验信息"}}
            </div>
        </div>
    </div>


</form>

<!-- TABLE渲染区 -->
<table class="layui-hide" id="tableList" lay-filter="tableList"></table>
<script type="text/html" id="toolBar">

    {{edit "编辑"}}
    {{delete "删除"}}

</script>
{{end}}
